name: Verify Whiteout
on:
  push:
    branches: ['feature/**', 'fix/**', main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # No manual music extraction: processResources restores the seven tracks
      # through preparePrivateSoundtrack, and the compare step below verifies them.
      - name: Fetch Gradle distribution with retry on transient CDN failures
        shell: bash
        run: |
          for attempt in 1 2 3 4; do
            if bash gradlew --version > /dev/null; then exit 0; fi
            echo "Gradle download failed (attempt $attempt/4)"
            sleep $((attempt * 10))
          done
          exit 1
      - name: Compile, regressions and Fabric side probes
        run: bash gradlew --no-daemon --console=plain check assembleWhiteout -I qa/foundation.gradle -I qa/dialogue-routes.gradle foundationTests routeProbeClient routeProbeServer
      - name: Verify complete resources and preserved music
        run: |
          python -X utf8 tests/run_resources.py
          python tools/private_music.py Whiteout-3.12.9-1.21.1.jar --compare build/release/Whiteout-3.13.0-1.21.1.jar
      - name: Boot and restart packaged Fabric dedicated server
        run: python -u tests/dedicated_lobby.py
      - name: Package the optional single-player Duo test map configuration
        run: |
          mkdir -p build/duo-test-kit/world
          cp -R docs/examples/duo-client/config build/duo-test-kit/
          cp docs/examples/duo-final-events.json build/duo-test-kit/world/whiteout-story-events.json
          cp docs/DUO-TEST-MODE-RU.md build/duo-test-kit/
      - name: Retain optional Duo test files
        uses: actions/upload-artifact@v4
        with:
          name: Whiteout-Duo-Test-Kit
          path: build/duo-test-kit/
          if-no-files-found: error
          retention-days: 14
      - name: Retain verified development build
        uses: actions/upload-artifact@v4
        with:
          name: Whiteout-3.13.0-roadmap-${{ github.sha }}
          path: build/release/Whiteout-3.13.0-1.21.1.jar
          if-no-files-found: error
          retention-days: 14
